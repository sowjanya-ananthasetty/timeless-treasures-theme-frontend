<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category | Timeless Treasures</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/logo.png">
</head>
<body>
  <div id="site-header"></div>
  <main class="page category-page">
    <div class="page-head left-page-head">
      <div>
        <span class="eyebrow">COLLECTION</span>
        <h1 id="category-title">Products</h1>
        <p id="category-count"></p>
      </div>
      <select id="category-sort" class="dark-select" aria-label="Sort products">
        <option value="featured">Featured</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
        <option value="name">Name: A-Z</option>
      </select>
    </div>

    <div id="keychain-tabs" class="category-tabs" hidden>
      <button type="button" data-keychain-tab="all">All</button>
      <button type="button" data-keychain-tab="Photo Keychains">Photo Keychains</button>
      <button type="button" data-keychain-tab="Name Keychains">Name Keychains</button>
    </div>

    <div class="category-layout">
      <aside class="filter-panel">
        <div class="filter-title">
          <h2>Filters</h2>
          <button onclick="clearCategoryFilters()">Clear All</button>
        </div>

        <div id="standard-price-filter" class="filter-group">
          <h3>Price</h3>
          <label><input type="checkbox" name="price" value="0-199"> Under ₹200</label>
          <label><input type="checkbox" name="price" value="200-399"> ₹200 – ₹399</label>
          <label><input type="checkbox" name="price" value="400-699"> ₹400 – ₹699</label>
          <label><input type="checkbox" name="price" value="700-plus"> ₹700+</label>
        </div>

        <div id="frame-price-filter" class="filter-group" hidden>
          <h3>Price</h3>
          <label><input type="checkbox" name="frame-price" value="under-500"> Under ₹500</label>
          <label><input type="checkbox" name="frame-price" value="500-999"> ₹500 – ₹999</label>
          <label><input type="checkbox" name="frame-price" value="1000-1499"> ₹1000 – ₹1499</label>
          <label><input type="checkbox" name="frame-price" value="1500-plus"> ₹1500+</label>
        </div>

        <div id="keychain-price-filter" class="filter-group" hidden>
          <h3>Price</h3>
          <label><input type="checkbox" name="keychain-price" value="under-200"> Under ₹200</label>
          <label><input type="checkbox" name="keychain-price" value="200-399"> ₹200 – ₹399</label>
          <label><input type="checkbox" name="keychain-price" value="400-599"> ₹400 – ₹599</label>
          <label><input type="checkbox" name="keychain-price" value="600-plus"> ₹600+</label>
        </div>

        <div id="keychain-type-filter" class="filter-group" hidden>
          <h3>Keychain Type</h3>
          <label><input type="checkbox" name="keychain-type" value="Photo Keychains"> Photo Keychains</label>
          <label><input type="checkbox" name="keychain-type" value="Name Keychains"> Name Keychains</label>
        </div>

        <div id="photo-capacity-filter" class="filter-group" hidden>
          <h3>Photo Capacity</h3>
          <label><input type="checkbox" name="photo-capacity" value="1"> 1 Photo</label>
          <label><input type="checkbox" name="photo-capacity" value="2"> 2 Photos</label>
          <label><input type="checkbox" name="photo-capacity" value="3"> 3 Photos</label>
          <label><input type="checkbox" name="photo-capacity" value="4"> 4 Photos</label>
          <label><input type="checkbox" name="photo-capacity" value="6"> 6 Photos</label>
          <label><input type="checkbox" name="photo-capacity" value="8"> 8 Photos</label>
          <label><input type="checkbox" name="photo-capacity" value="10"> 10 Photos</label>
        </div>

        <div id="bangle-color-filter" class="filter-group">
          <h3>Color</h3>
          <label><input type="checkbox" name="color" value="Gold"> Gold</label>
          <label><input type="checkbox" name="color" value="Red"> Red</label>
          <label><input type="checkbox" name="color" value="Pink"> Pink</label>
          <label><input type="checkbox" name="color" value="Green"> Green</label>
          <label><input type="checkbox" name="color" value="Purple"> Purple</label>
          <label><input type="checkbox" name="color" value="Blue"> Blue</label>
          <label data-non-bangle-color hidden><input type="checkbox" name="color" value="Black"> Black</label>
          <label data-non-bangle-color hidden><input type="checkbox" name="color" value="White"> White</label>
        </div>

        <div id="frame-color-filter" class="filter-group" hidden>
          <h3>Color</h3>
          <label><input type="checkbox" name="frame-color" value="Gold"> Gold</label>
          <label><input type="checkbox" name="frame-color" value="Brown"> Brown</label>
          <label><input type="checkbox" name="frame-color" value="Black"> Black</label>
          <label><input type="checkbox" name="frame-color" value="White"> White</label>
          <label><input type="checkbox" name="frame-color" value="Red"> Red</label>
        </div>

        <div id="keychain-color-filter" class="filter-group" hidden>
          <h3>Color</h3>
          <label><input type="checkbox" name="keychain-color" value="Black"> Black</label>
          <label><input type="checkbox" name="keychain-color" value="White"> White</label>
          <label><input type="checkbox" name="keychain-color" value="Pink"> Pink</label>
          <label><input type="checkbox" name="keychain-color" value="Blue"> Blue</label>
          <label><input type="checkbox" name="keychain-color" value="Red"> Red</label>
          <label><input type="checkbox" name="keychain-color" value="Gold"> Gold</label>
        </div>

        <div id="size-filter" class="filter-group" hidden>
          <h3>Size</h3>
          <label><input type="checkbox" name="size" value="2.10"> 2.10</label>
          <label><input type="checkbox" name="size" value="2.12"> 2.12</label>
          <label><input type="checkbox" name="size" value="2.14"> 2.14</label>
          <label><input type="checkbox" name="size" value="2.2"> 2.2</label>
          <label><input type="checkbox" name="size" value="2.3"> 2.3</label>
          <label><input type="checkbox" name="size" value="2.4"> 2.4</label>
          <label><input type="checkbox" name="size" value="2.5"> 2.5</label>
          <label><input type="checkbox" name="size" value="2.6"> 2.6</label>
          <label><input type="checkbox" name="size" value="2.8"> 2.8</label>
        </div>

        <div class="filter-group">
          <h3>Availability</h3>
          <label><input type="checkbox" name="availability" value="in-stock"> In Stock</label>
          <label><input type="checkbox" name="availability" value="out-of-stock"> Out of Stock</label>
        </div>
      </aside>

      <section>
        <div id="category-products" class="product-grid"></div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  
  <!-- WhatsApp Button -->

    </svg>
  </a>
  
  <script src="js/products.js"></script>
  <script src="js/product-store.js"></script>
  <script src="js/common.js"></script>
  <script>
    renderCategoryPage();
  </script>
</body>
</html>
