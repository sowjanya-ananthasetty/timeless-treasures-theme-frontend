<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop All | Timeless Treasures</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/logo.png">
</head>
<body data-page="shop">
  <div id="site-header"></div>
  <main class="page">
    <div class="page-head">
      <span class="eyebrow">OUR COLLECTION</span>
      <h1 id="shop-title">Shop All</h1>
      <p id="shop-count"></p>
    </div>
    <div class="toolbar">
      <select id="category-filter" class="dark-select" aria-label="Filter by category">
        <option value="">All Categories</option>
      </select>
      <select id="sort-products" class="dark-select" aria-label="Sort products">
        <option value="default">Sort: Featured</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
        <option value="name">Name: A-Z</option>
      </select>
    </div>
    <div id="shop-products" class="product-grid"></div>
  </main>
  <div id="site-footer"></div>
  <script src="js/products.js"></script>
  <script src="js/product-store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
