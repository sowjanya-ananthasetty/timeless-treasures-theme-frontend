<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order | Timeless Treasures</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/logo.png">
</head>
<body>
  <div id="site-header"></div>
  <main class="track-page">
    <div class="track-card">
      <span class="track-icon">📦</span>
      <span class="eyebrow">ORDER STATUS</span>
      <h1>Track Your Order</h1>
      <p>Enter the Order ID and mobile number shared with you after payment verification.</p>
      <form id="track-form">
        <input id="track-order-id" required placeholder="Order ID e.g. HM123456">
        <input id="track-mobile" required type="tel" placeholder="Mobile number">
        <button class="btn btn-primary" type="submit">Track Order</button>
      </form>
      <div id="track-result"></div>
    </div>
    <p class="form-note center-note">Frontend prototype: orders are currently stored only in this browser. A backend will make tracking work across devices.</p>
  </main>
  <div id="site-footer"></div>
  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script>
    initTrackOrder();
  </script>
</body>
</html>
